name: Deploy RPG Bot

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6.0.3

      - name: Copy files via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: 212.38.89.129
          username: dev
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          source: "index.js,package.json,package-lock.json,mapa.png,mapa_config.json,apiClient.js,catalogCache.js,cooldown.js,renderQueue.js,assets/**,canvas/**,commands/**,mapas-arena/**,utils/**"
          target: "/home/dev/bot-ernas"
          rm: false

      - name: SSH and Restart Bot
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 212.38.89.129
          username: dev
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            cd ~/bot-ernas
            npm install --omit=dev
            pm2 describe rpg-bot >/dev/null 2>&1 && pm2 restart rpg-bot || pm2 start index.js --name rpg-bot
            pm2 save
